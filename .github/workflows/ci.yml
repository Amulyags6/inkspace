name: InkSpace CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:

  # -----------------------------
  # 1. Lint
  # -----------------------------
  lint:
    name: 🔍 Lint ${{ matrix.component }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run ESLint
        working-directory: ${{ matrix.component }}
        run: npm run lint


  # -----------------------------
  # 2. Dependency Security
  # -----------------------------
  dependency-audit:
    name: 🛡️ Dependency Audit
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: npm audit
        working-directory: ${{ matrix.component }}
        run: npm audit --audit-level=high || true


  # -----------------------------
  # 3. Docker Build
  # -----------------------------
  docker-build:
    name: 🐳 Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: dependency-audit

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: false
          tags: inkspace-${{ matrix.component }}:ci
          provenance: true
          sbom: true


  # -----------------------------
  # 4. Trivy Image Scan
  # -----------------------------
  image-scan:
    name: 🔬 Scan ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: docker-build
    continue-on-error: true

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build \
            -t inkspace-${{ matrix.component }}:scan \
            ./${{ matrix.component }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inkspace-${{ matrix.component }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          timeout: "10m"


  # -----------------------------
  # 5. IaC Security Scan
  # -----------------------------
  iac-scan:
    name: 🏗️ IaC Security Scan
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          output_format: cli

      - name: Checkov Kubernetes scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true
          output_format: cli


  # -----------------------------
  # 6. Dockerfile Lint
  # -----------------------------
  dockerfile-lint:
    name: 📋 Dockerfile Lint
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: warning

