services:

  db:
    image: postgres:16-alpine
    container_name: inkspace-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: inkspace_user
      POSTGRES_PASSWORD: inkspace_pass_2026
      POSTGRES_DB: inkspace_db
   

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkspace_user -d inkspace_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    tmpfs:
      - /tmp
      - /run

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: inkspace-backend
    restart: unless-stopped

    environment:
      PORT: "5000"
      DB_USER: inkspace_user
      DB_PASSWORD: inkspace_pass_2026
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: inkspace_db

    expose:
      - "5000"

    depends_on:
      db:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: inkspace-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
